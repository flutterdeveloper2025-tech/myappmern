name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build React app
        working-directory: client
        env:
          VITE_API_URL: http://192.168.0.189:3000/api
        run: npm run build

      - name: Create Android project
        working-directory: client
        run: npx cap add android

      - name: Enable Android HTTP access
        working-directory: client
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if "android.permission.INTERNET" not in s:
              s = s.replace(
                  "</manifest>",
                  '    <uses-permission android:name="android.permission.INTERNET" />\n</manifest>"
              )

          if "android:usesCleartextTraffic" not in s:
              s = s.replace(
                  "<application ",
                  '<application android:usesCleartextTraffic="true" ',
                  1
              )

          p.write_text(s)
          PY

      - name: Sync Capacitor
        working-directory: client
        run: npx cap sync android

      - name: Build APK
        working-directory: client/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: it-service-desk-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
